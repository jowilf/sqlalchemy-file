name: Test suite

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  tests:
    name: "Python ${{ matrix.python-version }} · SQLAlchemy ${{ matrix.sqla }} pin"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.11", "3.12", "3.13", "3.14", "3.15" ]
        sqla: [ "20", "21" ]

    steps:
      - uses: actions/checkout@v4
      - name: Install uv and set up Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Lint
        run: uv run poe lint
      - name: Test suite
        run: uv run poe test-sqla${{ matrix.sqla }}
      - name: store coverage files
        uses: actions/upload-artifact@v7
        with:
          name: coverage-python${{ matrix.python-version }}-sqla${{ matrix.sqla }}
          path: .coverage*
          retention-days: 1
          include-hidden-files: true

  coverage:
    needs:
      - tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
      - name: get coverage files
        uses: actions/download-artifact@v8
        with:
          pattern: coverage*
          merge-multiple: true
      - name: Install Dependencies
        run: uv sync
      - name: Coverage Report
        run: uv run poe cov-report
      - name: Upload coverage
        uses: codecov/codecov-action@v7
