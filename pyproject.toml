[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sqlalchemy-file"
description = "SQLAlchemy-file is a SQLAlchemy extension for attaching files to SQLAlchemy model and uploading them to various storage."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = ["sqlalchemy", "sqlmodel", "file-upload", "apache-libcloud"]
authors = [
    { name = "Jocelin Hounon", email = "hounonj@gmail.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Database",
    "Topic :: Database :: Database Engines/Servers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "SQLAlchemy >=2.0",
    "apache-libcloud >=3.6",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://jowilf.github.io/sqlalchemy-file"
Documentation = "https://jowilf.github.io/sqlalchemy-file"
Repository = "https://github.com/jowilf/sqlalchemy-file"
Changelog = "https://jowilf.github.io/sqlalchemy-file/changelog/"

[project.optional-dependencies]
# Optional feature dependencies. Install with e.g.
# `pip install sqlalchemy-file[local,pillow]`.
pillow = [
    # Required by ImageField, ImageValidator and ThumbnailGenerator.
    "Pillow >=9.4",
]
local = [
    # Required by libcloud's LocalStorageDriver backend.
    "fasteners >=0.15",
]
all = [
    "Pillow >=9.4",
    "fasteners >=0.15",
]
# Dev tooling in PEP 735 groups, managed by uv. Tasks in [tool.poe.tasks];
# run with `uv run poe <task>`.
[dependency-groups]
dev = [
    "poethepoet >=0.30.0, <0.49.0",
    "pre-commit >=2.20.0",
    "uvicorn >=0.20.0",
]
lint = [
    "ruff ==0.17.1",
    "ty ==0.0.89",
]
test = [
    "pytest >=8",
    "testcontainers[mysql,postgres,minio] >=4.6",
    "fasteners >=0.15",
    "PyMySQL >=1.0.2",
    "psycopg2-binary >=2.9.5, <3.0.0",
    "Pillow >=9.4",
    "python-multipart >=0.0.6",
    "sqlmodel >=0.0.11",
    "fastapi >=0.92",
    "Flask >=2.2",
    "Flask-SQLAlchemy >=3.0",
    { include-group = "lint" },
]
cov = [
    "coverage[toml] >=7.4.0",
]
docs = [
    "mkdocstrings[python] >=0.27.0",
    "zensical ==0.0.71",
]
# Mutually exclusive SQLA test environments, see [tool.uv] conflicts.
sqla20 = [
    "SQLAlchemy >=2.0, <2.1",
]
sqla21 = [
    "SQLAlchemy >=2.1",
]

[tool.uv]
conflicts = [
    [
        { group = "sqla20" },
        { group = "sqla21" },
    ],
]
# sqla21 default so plain `uv sync` tests the 2.1 series. sqla20 is opt-in;
# conflicting groups require `uv run --no-default-groups --group sqla20 ...`.
default-groups = ["dev", "lint", "test", "cov", "docs", "sqla21"]

[tool.poe.tasks]
# Code quality
format = ["_ruff-fix", "_ruff-format"]
lint = ["_ty", "_ruff-check", "_ruff-format-check"]
_ty = "ty check sqlalchemy_file"
_ruff-check = "ruff check sqlalchemy_file tests"
_ruff-fix = "ruff check sqlalchemy_file tests --fix"
_ruff-format = "ruff format sqlalchemy_file tests docs_src examples"
_ruff-format-check = "ruff format sqlalchemy_file tests docs_src examples --check"

# Tests (sqla tasks re-sync their pinned group)
test = "coverage run -m pytest tests"
test-sqla20 = "uv run --no-default-groups --group sqla20 --group test --group cov coverage run -m pytest tests"
test-sqla21 = "uv run --group sqla21 coverage run -m pytest tests"
test-matrix = ["test-sqla20", "test-sqla21"]

# Coverage
cov-report = ["_cov-combine", "_cov-report", "_cov-xml"]
_cov-combine = "coverage combine"
_cov-report = "coverage report --show-missing"
_cov-xml = "coverage xml"

# Docs
docs-serve = "zensical serve -a localhost:8080"
docs-build = "zensical build"

# Clean
clean = "rm -rf .coverage .coverage.* coverage.xml .pytest_cache .ruff_cache .mypy_cache site .zensical"

[tool.hatch.version]
path = "sqlalchemy_file/__init__.py"

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:datetime.datetime.utcnow\\(\\) is deprecated:DeprecationWarning",
]

[tool.coverage.report]
fail_under = 99
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "except ImportError"
]

[tool.coverage.run]
parallel = true
command_line = "-m pytest"
source = ["sqlalchemy_file", "tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = [
    "B", # flake8-bugbear
    "C4", # flake8-comprehensions
    "C90", # mccabe
    "D", # pydocstyle
    "E", # pycodestyle errors
    "ERA", # eradicate
    "F", # pyflakes
    "I", # isort
    "N", # pep8-naming
    "PIE", # flake8-pie,
    "PLC", # pylint - convention
    "PLE", # pylint - error
    "PLW", # pylint - warning
    "Q", # flake8-quotes
    "RET", # flake8-return,
    "RUF", # Ruff-specific rules
    "SIM", # flake8-simplify
    "UP", # pyupgrade
    "W", # pycodestyle warnings
]
ignore = ["E501", "B904", "B008", "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107", "D205"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-third-party = ["sqlalchemy_file"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"docs_src/**" = ["N999"]
# Test fixtures intentionally keep temp files open for the test body.
"tests/**" = ["SIM115"]

[tool.ty.src]
include = ["sqlalchemy_file"]

[tool.ty.rules]
unused-ignore-comment = "error"
unused-type-ignore-comment = "error"

[tool.hatch.build.targets.wheel]
[tool.hatch.build.targets.sdist]
include = ["sqlalchemy_file"]
